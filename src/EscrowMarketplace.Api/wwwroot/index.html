<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studio Escrow</title>
  <meta name="description" content="Book recording studios. Your payment is held in escrow until the session is done.">
  <script>
    // Apply the saved theme before first paint (falls back to the OS setting)
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230f6f6c'/%3E%3Cpath d='M8 12h16M8 17h16M8 22h10' stroke='%23fff' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.7/signalr.min.js" defer></script>
  <script src="/js/icons.js" defer></script>
  <script src="/js/app.js" defer></script>
</head>
<body>
  <div class="shell">

    <!-- ============================ Sidebar ============================ -->
    <aside class="sidebar" aria-label="Studio Escrow">
      <a class="brand" href="/">
        <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
        <span class="brand-text">Studio Escrow</span>
      </a>

      <nav class="side-nav hidden" id="nav" aria-label="Sections"></nav>
      <p class="side-hint" id="side-hint">Sign in with a demo account to start.</p>

      <div class="side-foot">
        <div class="wallet hidden" id="wallet-chip">
          <span class="wallet-label">Wallet balance</span>
          <strong class="wallet-amount" id="wallet-balance">$0.00</strong>
        </div>

        <div class="side-status">
          <span class="live hidden" id="live-chip" title="Live updates">
            <span class="live-dot off" id="live-dot"></span>
            <span id="live-text">Offline</span>
          </span>
          <span class="side-tools">
            <a href="/scalar/v1" target="_blank" rel="noopener" class="icon-btn hide-sm" title="API reference (Scalar)" aria-label="API reference">
              <i data-icon="book-open-text" data-size="17"></i>
            </a>
            <a href="/hangfire" target="_blank" rel="noopener" class="icon-btn hide-sm" title="Background jobs (Hangfire, local only)" aria-label="Background jobs">
              <i data-icon="server-cog" data-size="17"></i>
            </a>
            <button class="icon-btn theme-toggle" id="theme-toggle" title="Toggle light / dark" aria-label="Toggle light or dark theme">
              <i data-icon="sun" data-size="17" class="icon-sun"></i>
              <i data-icon="moon" data-size="17" class="icon-moon"></i>
            </button>
          </span>
        </div>

        <div class="account hidden" id="account">
          <button class="account-btn" id="account-btn" aria-haspopup="true" aria-expanded="false">
            <span class="avatar" id="account-avatar">–</span>
            <span class="account-text">
              <span class="account-name" id="account-name">Signed out</span>
              <span class="account-role" id="account-role"></span>
            </span>
            <i data-icon="chevron-down" data-size="15"></i>
          </button>

          <div class="menu" id="account-menu" role="menu">
            <div class="menu-head">
              <div class="label">Signed in as</div>
              <div class="value" id="account-email">—</div>
            </div>
            <div class="menu-section-label">Switch to another demo user</div>
            <div id="switch-users"></div>
            <div class="menu-sep"></div>
            <button class="menu-item danger" id="sign-out" role="menuitem">
              <i data-icon="log-out" data-size="16"></i>
              Sign out
            </button>
          </div>
        </div>
      </div>
    </aside>

    <!-- ============================ Content ============================ -->
    <main class="main" id="main">
      <section class="tab-pane active" id="pane-signin"></section>
      <section class="tab-pane" id="pane-book"></section>
      <section class="tab-pane" id="pane-bookings"></section>
      <section class="tab-pane" id="pane-disputes"></section>
      <section class="tab-pane" id="pane-ledger"></section>
      <section class="tab-pane" id="pane-activity"></section>
    </main>
  </div>

  <!-- Generic form modal (cancel, decline, dispute, resolve) -->
  <div class="modal-overlay" id="form-modal" aria-hidden="true">
    <form class="modal-content" id="form-modal-form" role="dialog" aria-modal="true" aria-labelledby="form-modal-title">
      <div class="modal-header">
        <div class="modal-title-row">
          <span class="tile" id="form-modal-tile"></span>
          <div>
            <h3 id="form-modal-title">Title</h3>
            <p id="form-modal-desc"></p>
          </div>
        </div>
        <button type="button" class="modal-close" data-close aria-label="Close"><i data-icon="x" data-size="17"></i></button>
      </div>
      <div id="form-modal-fields"></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-close>Keep as is</button>
        <button type="submit" class="btn btn-primary" id="form-modal-submit">Confirm</button>
      </div>
    </form>
  </div>

  <div class="toast-container" id="toast-container" aria-live="polite"></div>
</body>
</html>
