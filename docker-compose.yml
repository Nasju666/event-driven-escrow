name: studio-escrow

services:
  postgres:
    image: postgres:16-alpine
    container_name: escrow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: EscrowMarketplaceDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d EscrowMarketplaceDb"]
      interval: 5s
      timeout: 5s
      retries: 5

  # SignalR backplane, only needed if you run more than one API instance.
  redis:
    image: redis:7-alpine
    container_name: escrow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Custom image: adds the delayed-message-exchange plugin the saga's timeouts depend on.
  rabbitmq:
    build:
      context: ./infra/rabbitmq
    container_name: escrow-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: escrow-api
    restart: on-failure
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=EscrowMarketplaceDb;Username=postgres;Password=postgrespassword"
      RabbitMQ__Host: "rabbitmq"
      RabbitMQ__Username: "guest"
      RabbitMQ__Password: "guest"
      SignalR__Redis: "redis:6379"
      # Short windows so the whole escrow flow (including auto-release) can be demoed in minutes.
      EscrowWorkflow__PaymentWindow: "00:05:00"
      EscrowWorkflow__ProviderResponseWindow: "00:10:00"
      EscrowWorkflow__InspectionWindow: "00:02:00"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  pgdata:
